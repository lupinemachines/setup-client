name: Setup LUPINE Client
description: Configure the LUPINE client for Lupine Cloud or a user-managed server.
author: lupinemachines

inputs:
  version:
    description: LUPINE release tag to download, or "latest".
    required: false
    default: latest
  cuda-version:
    description: CUDA version in the LUPINE client release asset name.
    required: false
    default: 13.1.0
  ubuntu-version:
    description: Ubuntu version in the LUPINE client release asset name.
    required: false
    default: "24.04"

outputs:
  lib-dir:
    description: Directory containing the LUPINE libcuda and libnvidia-ml shims.
    value: ${{ steps.setup.outputs.lib-dir }}
  libcuda:
    description: Path to the LUPINE libcuda.so.1 shim.
    value: ${{ steps.setup.outputs.libcuda }}
  libnvidia-ml:
    description: Path to the LUPINE libnvidia-ml.so.1 shim.
    value: ${{ steps.setup.outputs.libnvidia-ml }}
runs:
  using: composite
  steps:
    - name: Download LUPINE client release asset
      id: setup
      shell: bash
      env:
        INPUT_VERSION: ${{ inputs.version }}
        INPUT_CUDA_VERSION: ${{ inputs.cuda-version }}
        INPUT_UBUNTU_VERSION: ${{ inputs.ubuntu-version }}
      run: |
        set -euo pipefail

        for tool in curl unzip sha256sum; do
          if ! command -v "$tool" >/dev/null 2>&1; then
            echo "setup-client requires '$tool' on the runner." >&2
            exit 1
          fi
        done

        if [ "$(uname -s)" != "Linux" ]; then
          echo "setup-client currently supports Linux runners only." >&2
          exit 1
        fi

        machine="$(uname -m)"
        case "$machine" in
          x86_64|amd64)
            architecture="x86_64"
            ;;
          *)
            echo "No LUPINE client release asset is available for architecture: $machine" >&2
            exit 1
            ;;
        esac

        ubuntu_version="${INPUT_UBUNTU_VERSION#ubuntu}"
        asset_name="lupine-client-cuda-${INPUT_CUDA_VERSION}-ubuntu${ubuntu_version}-${architecture}.zip"

        if [ "$INPUT_VERSION" = "latest" ]; then
          download_url="https://github.com/lupinemachines/lupine/releases/latest/download/${asset_name}"
        else
          download_url="https://github.com/lupinemachines/lupine/releases/download/${INPUT_VERSION}/${asset_name}"
        fi

        if [ -n "${RUNNER_TOOL_CACHE:-}" ]; then
          install_dir="${RUNNER_TOOL_CACHE}/lupine-client/${INPUT_VERSION}/cuda-${INPUT_CUDA_VERSION}-ubuntu${ubuntu_version}-${architecture}"
        else
          install_dir="${RUNNER_TEMP:-/tmp}/lupine-client/${INPUT_VERSION}/cuda-${INPUT_CUDA_VERSION}-ubuntu${ubuntu_version}-${architecture}"
        fi

        tmp_dir="$(mktemp -d)"
        trap 'rm -rf "$tmp_dir"' EXIT

        mkdir -p "$install_dir"
        curl -fsSL --retry 3 --retry-delay 2 "$download_url" -o "$tmp_dir/$asset_name"
        unzip -q -o "$tmp_dir/$asset_name" -d "$install_dir"

        if [ -f "$install_dir/SHA256SUMS" ]; then
          (cd "$install_dir" && sha256sum -c SHA256SUMS)
        fi

        libcuda="$install_dir/libcuda.so.1"
        libnvidia_ml="$install_dir/libnvidia-ml.so.1"

        test -f "$libcuda"
        test -f "$libnvidia_ml"

        ln -sfn libcuda.so.1 "$install_dir/libcuda.so"
        ln -sfn libnvidia-ml.so.1 "$install_dir/libnvidia-ml.so"

        use_cloud=true
        if [ -n "${LUPINE_SERVER:-}" ]; then
          use_cloud=false
        fi

        {
          echo "LUPINE_HOME=$install_dir"
          echo "LUPINE_LIB_DIR=$install_dir"
          echo "LUPINE_LIBCUDA=$libcuda"
          echo "LUPINE_LIB=$libcuda"
          echo "LD_LIBRARY_PATH=$install_dir:${LD_LIBRARY_PATH:-}"
        } >> "$GITHUB_ENV"

        {
          echo "lib-dir=$install_dir"
          echo "libcuda=$libcuda"
          echo "libnvidia-ml=$libnvidia_ml"
          echo "use-cloud=$use_cloud"
        } >> "$GITHUB_OUTPUT"

    - name: Install Lupine Cloud CLI
      id: cli
      if: ${{ steps.setup.outputs.use-cloud == 'true' }}
      shell: bash
      run: |
        set -euo pipefail

        cli_install_dir="${RUNNER_TOOL_CACHE:-${RUNNER_TEMP:-/tmp}}/lupine-cli/latest/bin"

        tmp_dir="$(mktemp -d)"
        trap 'rm -rf "$tmp_dir"' EXIT
        curl -fsSL --retry 3 --retry-delay 2 https://dl.lupine.sh/install.sh -o "$tmp_dir/install.sh"
        LUPINE_VERSION=latest LUPINE_INSTALL_DIR="$cli_install_dir" sh "$tmp_dir/install.sh"

        cli_path="$cli_install_dir/lupine"
        test -x "$cli_path"
        echo "$cli_install_dir" >> "$GITHUB_PATH"
        echo "LUPINE_STATE_DIR=${RUNNER_TEMP:-/tmp}/lupine-state" >> "$GITHUB_ENV"
        echo "cli-path=$cli_path" >> "$GITHUB_OUTPUT"

    - name: Authenticate to Lupine with GitHub Actions OIDC
      if: ${{ steps.setup.outputs.use-cloud == 'true' }}
      shell: bash
      run: |
        set -euo pipefail
        "${{ steps.cli.outputs.cli-path }}" oidc github-actions
